; BroTracker PlatformIO configuration
;
; The current PlatformIO environment builds the standalone
; Teensy 4.1 SD storage probe.
;
; BroTracker reusable components remain in the repository
; libraries/ directory and are shared between platforms.
;
; pio run -d tools/teensy_diagnostics/sd_storage_probe
; or
; pio run -d tools/teensy_diagnostics/sd_storage_probe -t upload -t monitor
;

[platformio]
lib_dir = ../../../libraries

[env:teensy41]
platform = teensy
framework = arduino
board = teensy41

monitor_speed = 115200
