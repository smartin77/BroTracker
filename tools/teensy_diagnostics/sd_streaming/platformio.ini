[platformio]
default_envs = teensy41
lib_dir = ../../../libraries
[env:teensy41]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
build_flags =
    -D USB_SERIAL
    -D STREAM_RING_BYTES=16384
    -I../../../src
extra_scripts = pre:map.py
[env:ring8]
extends = env:teensy41
build_flags =
    -D USB_SERIAL
    -D STREAM_RING_BYTES=8192
    -I../../../src
[env:ring32]
extends = env:teensy41
build_flags =
    -D USB_SERIAL
    -D STREAM_RING_BYTES=32768
    -I../../../src
[env:low_ram]
extends = env:teensy41
build_flags =
    -D USB_SERIAL
    -D STREAM_RING_BYTES=8192
    -D STREAM_STAGING_BYTES=4096
    -I../../../src
[env:headroom]
extends = env:teensy41
build_flags =
    -D USB_SERIAL
    -D STREAM_RING_BYTES=16384
    -D STREAM_STAGING_BYTES=8192
    -I../../../src
