; BroTracker PlatformIO configuration
;
; The current PlatformIO environment builds the standalone
; Teensy 4.1 audio timing benchmark.
;
; BroTracker reusable components remain in the repository
; libraries/ directory and are shared between platforms.
;
; Hardware verification is performed manually by the developer.
;
; from root of project run:
; pio run
; or
; pio run -t upload -t monitor
;

[platformio]
default_envs = teensy41

src_dir = firmware/teensy/BroTracker

; Reusable BroTracker libraries.
; Platform-independent and platform-specific libraries are
; both kept under the repository libraries/ directory.
lib_dir = libraries

[env:teensy41]
platform = teensy
framework = arduino
board = teensy41

extra_scripts = pre:tools/teensy_usb_audio/prepare_core.py

monitor_speed = 115200

build_flags =
    -D USB_MIDI_AUDIO_SERIAL

; Explicit opt-in diagnostic firmware; ordinary teensy41 remains unchanged.
[env:teensy41_usb_trace]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -D BROTRACKER_USB_TX_TRACE

; RAM-only pattern bring-up, temporary BTTEST1 compatibility with Windows BTX.
; Inherits the verified USB preparation script; neither legacy WAV playback nor
; USB trace instrumentation is enabled. Hardware validation remains manual.
[env:teensy41_pattern]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -D BROTRACKER_PATTERN_BRINGUP
    -Isrc
