; BroTracker PlatformIO firmware configuration
;
; Run each command from the repository root. teensy41_dev is the default.
; Build/upload the default: pio run -t upload (upload includes building).
; Use -e <environment> to select an explicit regression/diagnostic environment.
; Firmware build:
; pio run -e <environment>
; Firmware build and upload (upload already includes building):
; pio run -e <environment> -t upload
; Serial monitor (close BTX first so it releases the serial port):
; pio device monitor -e <environment>
;
; Environments:
; teensy41_dev: primary variable-rate SD development configuration, including
; PERF diagnostics, Sample playback and the sine Synth foundation. Output defaults to
; USB_BRIDGE; override with [audio] output=bridge/pt8211/audio_shield in the host config.ini.
; Existing explicit environments remain available for regression testing:
; teensy41: ordinary legacy firmware (historical baseline).
; teensy41_usb_trace: USB trace diagnostics.
; teensy41_pattern: historical RAM-only beeper pattern playback and BTX control.
; teensy41_pattern_perf: diagnostic pattern playback with cycle-cost diagnostics.
; teensy41_pattern_sd_prepare: diagnostic preparation stage; performance diagnostics plus boot-time SD WAV
; preparation into RAM2; the loaded WAV is not yet played.
; teensy41_pattern_sd_playback: native-rate regression stage; adds the prepared WAV on a third pattern channel.
; teensy41_pattern_variable_rate: same SD fixture with variable-rate note playback
; and retained PERF diagnostics; linear interpolation, matching sample rates only.
; teensy41_pt8211_test: isolated left/right PT8211 smoke test; no BroTracker or BTX.
; teensy41_audio_shield_test: isolated I2S/SGTL5000 headphone test; no optional memory.
;
; PlatformIO builds firmware, not Windows BTX. Package Windows BTX separately:
; powershell -NoProfile -ExecutionPolicy Bypass -File tools/windows/build-package.ps1 -ToolchainBin D:/dev/msys64/ucrt64/bin
; ToolchainBin above is the developer's local toolchain path; adjust as needed.
; Launch the packaged Windows BTX from the repository root:
; .\deploy\windows\BroTrackerTerminal.exe
;
; Reusable components live in libraries/ and are shared between platforms.
; Hardware verification is performed manually by the developer.

[platformio]
default_envs = teensy41_dev

src_dir = firmware/teensy/BroTracker

; Reusable BroTracker libraries.
; Platform-independent and platform-specific libraries are
; both kept under the repository libraries/ directory.
lib_dir = libraries

[env:teensy41]
platform = teensy
framework = arduino
board = teensy41

extra_scripts = pre:tools/teensy_usb_audio/prepare_core.py

monitor_speed = 115200

build_flags =
    -D USB_MIDI_AUDIO_SERIAL

; Explicit opt-in diagnostic firmware; ordinary teensy41 remains unchanged.
[env:teensy41_usb_trace]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -D BROTRACKER_USB_TX_TRACE

; RAM-only pattern bring-up, temporary BTTEST1 compatibility with Windows BTX.
; Inherits the verified USB preparation script; neither legacy WAV playback nor
; USB trace instrumentation is enabled. Hardware validation remains manual.
[env:teensy41_pattern]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -D BROTRACKER_PATTERN_BRINGUP
    -Isrc

; Optional cycle-cost reporting; uninstrumented teensy41_pattern stays unchanged.
[env:teensy41_pattern_perf]
extends = env:teensy41_pattern
build_flags =
    ${env:teensy41_pattern.build_flags}
    -D BROTRACKER_PATTERN_PERF

; Boot-only SD preparation into reserved RAM2; no additional sample playback.
[env:teensy41_pattern_sd_prepare]
extends = env:teensy41_pattern_perf
build_flags =
    ${env:teensy41_pattern_perf.build_flags}
    -D BROTRACKER_PATTERN_SD_PREPARE

; Opt-in native-rate playback of the prepared WAV; failure retains two beepers.
[env:teensy41_pattern_sd_playback]
extends = env:teensy41_pattern_sd_prepare
build_flags =
    ${env:teensy41_pattern_sd_prepare.build_flags}
    -D BROTRACKER_PATTERN_SD_PLAYBACK

; Opt-in variable-rate player; unchanged reference-note fixture and SD fallback.
[env:teensy41_pattern_variable_rate]
extends = env:teensy41_pattern_sd_playback
build_flags =
    ${env:teensy41_pattern_sd_playback.build_flags}
    -D BROTRACKER_PATTERN_VARIABLE_RATE

; Primary development: inherited Sample/Synth fixture and retained PERF diagnostics.
[env:teensy41_dev]
extends = env:teensy41_pattern_variable_rate
build_flags =
    ${env:teensy41_pattern_variable_rate.build_flags}

; Standalone hardware test: do not inherit the application/USB-audio environment.
; The pre-script selects a sibling source directory only for this environment.
[env:teensy41_pt8211_test]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
extra_scripts = pre:firmware/teensy/pt8211_test/select_source.py
build_flags = -D USB_SERIAL
build_src_filter = -<*> +<main.cpp>

; Isolated empirical pin-loading experiment; starts only after host GO command.
[env:teensy41_pt8211_probe]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
extra_scripts = pre:firmware/teensy/pt8211_probe/select_source.py
build_flags = -D USB_SERIAL
build_src_filter = -<*> +<main.cpp>

; One Teensy 4.x Audio Shield (Rev D2 priority), alternative to PT8211.
; No production sources, USB-audio preparation, SD or external-memory dependency.
[env:teensy41_audio_shield_test]
platform = teensy
framework = arduino
board = teensy41
monitor_speed = 115200
extra_scripts = pre:firmware/teensy/audio_shield_test/select_source.py
build_flags = -D USB_SERIAL
build_src_filter = -<*> +<main.cpp>
